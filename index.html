<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Sinnoh Trainer Log</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>html{scroll-padding-top:env(safe-area-inset-top,0px)}:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
/* Look: the Sinnoh menu screens of Diamond and Pearl. Pale sky ground with a faint diamond lattice,
   panels drawn as navy-framed game windows, pixel type for names and numbers, a red ▶ cursor in the menu,
   Pokétch-green LCD tiles for stats, and every Pokémon tinted by its own type colours. */
:root{
  --bg:#D9E5F8; --lat:rgba(45,95,214,.075); --panel:#EBF1FC; --raised:#FFFFFF; --field:#FFFFFF;
  --ink:#14203F; --muted:#4E5E88; --line:#BFCCE8; --line-soft:#DCE5F5;
  --accent:#2A5BD0; --accent-ink:#FFFFFF; --accent-soft:#D8E3FA;
  --frame:#24387A; --frame-in:#C9D8F6; --frame-sh:#A3B5E0; --cursor:#D8433A; --spr-base:#FFFFFF;
  --lcd:#C8DAA6; --lcd-ink:#1F2E14; --lcd-dim:#5F7745; --lcd-edge:#9DB27A; --lcd-inset:#D6E5BB;
  --good:#2C7A4B; --warn:#A8620A; --bad:#B9301F; --gold:#C4951A; --gold-ink:#3B2B00; --gen-m:#2457A6; --gen-f:#A32A6A;
  --shadow:0 2px 0 rgba(36,56,122,.25),0 10px 24px rgba(20,32,63,.14);
  --f-pix:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --f-num:'VT323','Pixelify Sans',ui-monospace,monospace;
  --f-display:var(--f-pix);
  --f-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:var(--f-body);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1128; --lat:rgba(127,166,255,.06); --panel:#101A38; --raised:#16224A; --field:#0B1430;
  --ink:#E6ECFB; --muted:#9AA9CF; --line:#2A3A6B; --line-soft:#1F2D57;
  --accent:#7FA6FF; --accent-ink:#071030; --accent-soft:#1D2D5E;
  --frame:#6F8EE6; --frame-in:#0F1836; --frame-sh:#050A1A; --cursor:#FF6B5E; --spr-base:#CBD5F2;
  --lcd:#27311D; --lcd-ink:#C2DB99; --lcd-dim:#7E9862; --lcd-edge:#3A4A2A; --lcd-inset:#1E2716;
  --good:#5CC48A; --warn:#E3A748; --bad:#F2846E; --gold:#E3B84A; --gold-ink:#2B2000; --gen-m:#8DB3F4; --gen-f:#F2A0CB;
  --shadow:0 2px 0 rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1128; --lat:rgba(127,166,255,.06); --panel:#101A38; --raised:#16224A; --field:#0B1430;
  --ink:#E6ECFB; --muted:#9AA9CF; --line:#2A3A6B; --line-soft:#1F2D57;
  --accent:#7FA6FF; --accent-ink:#071030; --accent-soft:#1D2D5E;
  --frame:#6F8EE6; --frame-in:#0F1836; --frame-sh:#050A1A; --cursor:#FF6B5E; --spr-base:#CBD5F2;
  --lcd:#27311D; --lcd-ink:#C2DB99; --lcd-dim:#7E9862; --lcd-edge:#3A4A2A; --lcd-inset:#1E2716;
  --good:#5CC48A; --warn:#E3A748; --bad:#F2846E; --gold:#E3B84A; --gold-ink:#2B2000; --gen-m:#8DB3F4; --gen-f:#F2A0CB;
  --shadow:0 2px 0 rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:repeating-linear-gradient(45deg,var(--lat) 0 1.5px,transparent 1.5px 30px),repeating-linear-gradient(-45deg,var(--lat) 0 1.5px,transparent 1.5px 30px);color:var(--ink);font:500 15px/1.5 var(--f-body);padding-inline:16px;padding-block:0;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-body);font-weight:700;font-variant-numeric:tabular-nums}
.prewrap{white-space:pre-wrap;overflow-wrap:anywhere}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* shell: sidebar + stage */
.shell{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:0 28px;padding-bottom:110px}
.stage{min-width:0}
.side{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:22px 0;display:flex;flex-direction:column;gap:20px}
.scrim{display:none}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:46px;height:46px;position:relative;display:grid;place-items:center;flex:none}
.logo::before{content:'';position:absolute;inset:6px;transform:rotate(45deg);border-radius:7px;background:var(--lcd);border:2px solid var(--frame);box-shadow:inset 0 0 0 2px var(--lcd-inset),0 2px 0 var(--frame-sh)}
.logo i{position:relative;font:700 12px var(--f-pix);font-style:normal;color:var(--lcd-ink)}
.brand b{font:600 17px/1.15 var(--f-pix);display:block;overflow-wrap:anywhere}
.brand small{color:var(--muted);font-size:12px}
.ng{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.nt{font:800 13px var(--f-body);color:var(--muted);padding:0 10px 4px 26px}
.nv{appearance:none;border:0;background:none;color:var(--muted);position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px 8px 26px;border-radius:10px;font:800 15px var(--f-body);cursor:pointer}
.nv::before{content:'';position:absolute;left:9px;top:50%;transform:translateY(-50%);border-left:8px solid var(--cursor);border-top:6px solid transparent;border-bottom:6px solid transparent;opacity:0}
.nv:hover{background:var(--panel);color:var(--ink)}
.nv:hover::before{opacity:.4}
.nv[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:0 0 0 2px var(--frame),inset 0 0 0 2px var(--frame-in)}
.nv[aria-current="page"]::before{opacity:1}
.nv .n{font:800 12px var(--f-body);background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:1px 7px}
.nv[aria-current="page"] .n{background:var(--raised)}

/* top bar */
.bar{position:sticky;top:10px;z-index:20;margin-top:16px;background:var(--raised);border:2px solid var(--frame);border-radius:14px;box-shadow:inset 0 0 0 2px var(--frame-in),0 3px 0 var(--frame-sh);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px}
.bar-t{flex:1 1 150px;min-width:0}
.bar-title{font:600 clamp(23px,3.4vw,31px)/1.1 var(--f-pix);margin:0}
.bar-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .menu-btn{display:none}
.eyebrow{font:800 13px/1.3 var(--f-body);color:var(--muted)}
.chip{font:800 12.5px var(--f-body);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 10px}
.chip.gm{background:var(--gold);color:var(--gold-ink)}
.save{font:700 12.5px var(--f-body);color:var(--muted)}
.themebtn{padding:5px 8px!important;color:var(--muted)}
.themebtn:hover:not(:disabled){color:var(--accent)}
.save.err{color:var(--bad)}
.save.busy{color:var(--warn)}
.online{display:inline-flex;align-items:center;gap:8px}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;border:2px solid var(--bg);margin-left:-8px;object-fit:cover;display:block}
.avs .av:first-child{margin-left:0}
.av.ini{display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:600 12px var(--f-body)}
.online .mono{font-size:12px;color:var(--muted)}
.online .mono::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px}
@media (max-width:879px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .bar .menu-btn{display:inline-flex}
  .side{display:none;position:fixed;top:0;bottom:0;left:0;width:min(86vw,300px);max-height:none;z-index:50;background:var(--panel);border-right:2px solid var(--frame);padding:18px 14px;box-shadow:var(--shadow)}
  .bar{top:6px;margin-top:10px}
  .shell.nav-open .side{display:flex}
  .shell.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(8,14,26,.5);z-index:45}
}
.shell.no-side{grid-template-columns:minmax(0,1fr)}
.no-side .side,.no-side .bar .menu-btn{display:none!important}
main{display:flex;flex-direction:column;gap:18px;padding-top:18px;min-height:50vh}
main:focus{outline:none}
label.btn{position:relative}
.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* banners */
.banner{border:2px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{border-color:var(--warn);color:var(--ink)}
.pinned{background:var(--raised);border:2px solid var(--frame);border-left:8px solid var(--gold);border-radius:12px;box-shadow:0 3px 0 var(--frame-sh);padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.empty{border:2px dashed var(--line);background:color-mix(in srgb,var(--raised) 70%,transparent);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font:600 20px var(--f-pix);color:var(--ink)}
.empty p{max-width:52ch}

/* panels and cards */
.panel{background:var(--raised);border:2px solid var(--frame);border-radius:14px;box-shadow:inset 0 0 0 2px var(--frame-in),0 3px 0 var(--frame-sh);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ph h2{font:600 19px/1.2 var(--f-pix)}
.ph .acts{display:flex;gap:6px;flex-wrap:wrap}
.sub{font-size:13px;color:var(--muted)}
.grid{display:grid;gap:12px}
.cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.sheet{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:880px){.sheet{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* form fields */
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fl{font:800 12.5px var(--f-body);color:var(--muted)}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:9px;padding:6px 9px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:62px;field-sizing:content;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
input:disabled,select:disabled,textarea:disabled{background:transparent;border-color:transparent;-webkit-text-fill-color:var(--ink);opacity:1;appearance:none;padding-inline:0;resize:none}
select:disabled{background-image:none}
.fgrid{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.fgrid .wide{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}

/* buttons */
.btn{appearance:none;border:2px solid var(--frame);border-bottom-width:4px;background:var(--raised);color:var(--ink);border-radius:10px;padding:5px 12px 4px;font:800 13.5px var(--f-body);cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;padding-bottom:6px}
.btn.primary{background:var(--accent);border-color:var(--frame);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:3px 10px 2px;font-size:12.5px}
.btn.sm:active:not(:disabled){padding-bottom:4px}
.btn.danger:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:active:not(:disabled){transform:none}
.seg{display:inline-flex;border:2px solid var(--frame);border-radius:10px;overflow:hidden;background:var(--raised);flex-wrap:wrap}
.seg button{appearance:none;border:0;background:none;padding:5px 12px;font:800 13px var(--f-body);color:var(--muted);cursor:pointer;border-right:2px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* LCD tiles */
.lcd{background:var(--lcd);color:var(--lcd-ink);border:2px solid var(--lcd-edge);border-radius:10px;box-shadow:inset 0 0 0 2px var(--lcd-inset)}
.stats{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
.stat{padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.stat .sl{font:800 12px var(--f-body);color:var(--lcd-dim)}
.stat .sv{font:400 38px/1 var(--f-num)}
.stat input{font:400 38px/1 var(--f-num);background:transparent;border:0;padding:0;width:3.2ch;color:inherit;-moz-appearance:textfield;border-radius:0}
.stat input::-webkit-inner-spin-button,.stat input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stat input:disabled{-webkit-text-fill-color:var(--lcd-ink)}
.stat .sm{font:500 12px var(--f-mono);display:flex;gap:8px;justify-content:space-between;align-items:center}
.stat .mini{display:flex;gap:6px;margin-top:4px}
.stat .mini input{font:500 12px var(--f-mono);width:100%;background:var(--lcd-inset);border:1px solid var(--lcd-edge);padding:2px 4px;border-radius:3px}
.stat .mini label{display:flex;flex-direction:column;font:800 11px var(--f-body);color:var(--lcd-dim);min-width:0;flex:1}
.stat .rollbtn{appearance:none;border:2px solid var(--lcd-edge);background:var(--lcd-inset);color:var(--lcd-ink);border-radius:6px;font:800 12px var(--f-body);padding:0 7px;cursor:pointer}
.stat .rollbtn:hover{border-color:var(--lcd-ink)}
.hpbox{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.hpbox .nums{display:flex;align-items:baseline;gap:6px;font:400 34px/1 var(--f-num)}
.hpbox .nums input{font:400 34px/1 var(--f-num);background:transparent;border:0;padding:0;width:3.4ch;color:inherit;-moz-appearance:textfield;border-radius:0}
.hpbox .nums input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
@supports (field-sizing:content){.hpbox .nums input,.stat input{field-sizing:content;width:auto;min-width:1.2ch}}
.hpbox .nums input:disabled{-webkit-text-fill-color:var(--lcd-ink)}
.hpbox .nums span{font:400 22px/1 var(--f-num);color:var(--lcd-dim)}
.hpbtns{display:flex;gap:4px;flex-wrap:wrap}
.hpbtns button{appearance:none;border:2px solid var(--lcd-edge);background:var(--lcd-inset);color:var(--lcd-ink);border-radius:6px;font:800 12.5px var(--f-body);padding:1px 8px;cursor:pointer}
progress.hp{appearance:none;-webkit-appearance:none;width:100%;height:12px;border:2px solid var(--lcd-edge);border-radius:8px;background:var(--lcd-inset);overflow:hidden}
progress.hp::-webkit-progress-bar{background:var(--lcd-inset);border-radius:6px}
progress.hp::-webkit-progress-value{background:var(--good);border-radius:6px;transition:width .35s ease}
progress.hp::-moz-progress-bar{background:var(--good);border-radius:6px}
progress.hp.warn::-webkit-progress-value{background:var(--warn)}
progress.hp.warn::-moz-progress-bar{background:var(--warn)}
progress.hp.bad::-webkit-progress-value{background:var(--bad)}
progress.hp.bad::-moz-progress-bar{background:var(--bad)}
.hpline{display:flex;gap:8px;align-items:center}
.hpline progress{flex:1}
.hpline .mono{font:400 21px/1 var(--f-num);color:var(--muted)}

/* skills */
.sgroup{display:flex;flex-direction:column}
.sgroup h3{font:800 13px var(--f-body);color:var(--muted);padding:8px 0 4px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 44px 40px auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.skill .sname{overflow-wrap:anywhere}
.skill .bonus{font:400 24px/1 var(--f-num);text-align:right}
.tal{appearance:none;border:2px solid var(--line);background:var(--field);border-radius:7px;font:800 12px var(--f-body);padding:3px 0;cursor:pointer;color:var(--muted)}
.tal.t1{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tal.t2{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tal:disabled{cursor:default}

/* badge case */
.case{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px;border-radius:18px;background:radial-gradient(120% 90% at 50% 0,#2B3F88 0,#18235A 55%,#0E1638 100%);border:3px solid #E1BD55;box-shadow:inset 0 0 0 2px #7A5D12,inset 0 8px 20px rgba(0,0,0,.5),0 3px 0 var(--frame-sh)}
.case.full{box-shadow:inset 0 0 0 2px #7A5D12,inset 0 8px 20px rgba(0,0,0,.5),0 0 20px 3px rgba(240,200,80,.6)}
@media (max-width:470px){.case{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{appearance:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:11px 4px 9px;border-radius:14px;background:rgba(5,9,28,.55);box-shadow:inset 0 3px 9px rgba(0,0,0,.65),inset 0 -1px 0 rgba(255,255,255,.08);color:#8795C4;font:800 13px var(--f-body);min-width:0}
.slot small{font-weight:700;font-size:11.5px;color:#6E7EB0}
.slot:disabled{cursor:default}
.slot:focus-visible{outline:3px solid #fff;outline-offset:2px}
.medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;position:relative;margin-bottom:4px;color:#7E8CBA;background:radial-gradient(circle at 34% 28%,#4B5784,#232C54 72%);border:3px solid #38447A;box-shadow:inset 0 2px 5px rgba(0,0,0,.55);transition:transform .15s}
.medal .gl{width:34px;height:34px;opacity:.3}
.slot:not(:disabled):hover .medal{transform:translateY(-2px)}
.slot.on{color:#fff}
.slot.on small{color:#C9D3F5}
.slot.on .medal{color:#fff;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--bc) 50%,#fff),var(--bc) 52%,color-mix(in srgb,var(--bc) 60%,#000));border-color:#F0CF67;box-shadow:0 0 0 2px #7A5D12,0 3px 8px rgba(0,0,0,.6),0 0 18px color-mix(in srgb,var(--bc) 65%,transparent)}
.slot.on .medal::before{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(140deg,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 42%)}
.slot.on .medal .gl{opacity:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
@media (prefers-reduced-motion:no-preference){
  .slot.pop .medal{animation:medalPop .85s cubic-bezier(.2,1.4,.4,1) both}
  .slot.pop .medal::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:3px solid #FFF3B0;animation:medalRing .95s ease-out both}
}
@keyframes medalPop{0%{transform:scale(.5) rotate(-30deg);filter:brightness(2.2)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:none;filter:none}}
@keyframes medalRing{from{opacity:.95;transform:scale(1)}to{opacity:0;transform:scale(2)}}
.dots{display:flex;gap:4px;align-items:center}
.dot{--bc:var(--gold);width:13px;height:13px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.dot.on{background:var(--bc);border-color:var(--frame)}

/* lists inside panels */
.item{border:2px solid var(--line-soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.item .irow{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) 72px auto;align-items:end}
.item .irow.two{grid-template-columns:minmax(0,1fr) auto}
.item .irow.ic{grid-template-columns:68px minmax(0,1fr) 72px auto}
.itile{width:68px;height:68px;display:grid;place-items:center;overflow:hidden;border-radius:14px;border:2px solid var(--line);background:linear-gradient(160deg,var(--raised),var(--panel));box-shadow:inset 0 0 0 2px var(--frame-in)}
.itile .sp{width:60px;height:60px;image-rendering:pixelated}

/* mega evolution: a Key Stone gem, a rainbow ring around a Pokémon that has evolved */
:root{--mega-g:conic-gradient(from 200deg,#ff7aa8,#ffd86b,#8af0b0,#6cc8ff,#b48cff,#ff7aa8);--mega-lin:linear-gradient(90deg,#ffb3cf,#ffe39a,#aef2c4,#9bd8ff,#c9b0ff);--mega-ink:#2a1747}

.kchip{display:inline-flex;align-items:center;font:800 12.5px var(--f-body);padding:2px 10px 2px 6px;border-radius:999px;border:2px solid var(--frame);background:var(--raised);color:var(--ink);white-space:nowrap}

.mon.mega{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--t1) 38%,var(--frame-in)),0 3px 0 var(--frame-sh),0 0 18px 2px rgba(170,130,255,.5)}
.mon.mega .spr{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 0 12px rgba(190,150,255,.85)}
.mon.mega::after,.megap.on::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:3px;background:var(--mega-g);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none;z-index:2}
